volumes:
  mlflow_db: {}
  grafana_data: {}
  prometheus_data: {}

networks:
  front-tier:
  back-tier:

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root ./mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow.db
      - ./mlruns:/mlruns
    networks:
      - back-tier

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - back-tier

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    command: php -S 0.0.0.0:8080 /var/www/html/adminer.php
    networks:
      - back-tier
      - front-tier
    depends_on:
      - db

  grafana:
    image: grafana/grafana-enterprise
    # environment:
    #   GF_DATABASE_HOST: db       # Nome do serviço do banco no compose
    #   GF_DATABASE_USER: postgres # Usuário padrão do PostgreSQL
    #   GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}  # Mesma senha definida no serviço do db
    user: "472"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/config/grafana_datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./grafana/config/grafana_dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards:/opt/grafana/dashboards
    networks:
      - back-tier
      - front-tier
    restart: always
    depends_on:
      - db

  fastapi:
    build: .  # Ou use image: se já tiver uma imagem
    ports:
      - "8000:8000"  # Expõe a porta do FastAPI
    volumes:
      # - ./app:/app   # Mapeia o código fonte (opcional)
      # - ./scr:/app/scr  # Opcional: mapeia o código para desenvolvimento
      - ./mlflow.db:/mlflow.db   # Volume para o SQLite
      - ./mlruns:/mlruns         # Artefatos do MLflow
    environment:
      - PYTHONPATH=/app  # Garante que o Python encontra o módulo scr
      - MLFLOW_TRACKING_URI=http://mlflow:5000  # Acessa o MLflow pelo nome do serviço
    depends_on:
      - mlflow
    networks:
      - back-tier

